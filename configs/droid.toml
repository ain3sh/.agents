# droid.toml - unified droid config file

# ------------------------------------------------------------------------------
[hooks]

# ---
[hooks.session_start]

[hooks.session_start.tool_wrappers]
when = ["startup", "resume", "clear"]
tools = ["rg", "agent-browser", "cua-driver", "vscode-ws"]

[hooks.session_start.tool_wrappers.targets]
rg = ["path:/usr/bin/rg", "path:/bin/rg", "path:/usr/local/bin/rg"]
agent-browser = ["npm:agent-browser"]
cua-driver = ["path:~/.agents/scripts/cua-driver"]
vscode-ws = ["path:~/.agents/skills/vscode-workspace/scripts/vscode_ws.py"]

[hooks.session_start.environment]
when = ["startup", "resume", "clear"]
secrets = "~/.factory/.env" # .env secrets ****** by env vars session-start hook
path_prepend = ["~/.local/bin"]
# export the session id as DROID_SESSION_ID so tools (e.g. vscode-ws ensure)
# can tag resources with their owning session for SessionEnd cleanup
export_session_id = true
# config env vars
EXAMPLE_CONFIG_VAR = "clod"
TIRITH_INTEGRATION = "droid-cli"

[hooks.session_start.vscode_workspaces]
# Idle reaper for vscode workspaces (vscode-workspace skill): retires
# workspaces no session has ensured within the window. Catches orphans from
# hard-crashed sessions whose session_end hook never ran.
enabled = true
when = ["startup"]
idle_hours = 12

[hooks.session_start.instructions]
prompts_dir = "~/.agents/prompts"
# prompt composition rules (ordered, files relative to prompts_dir)
[[hooks.session_start.instructions.rules]]
when = ["clear"]
include = ["SOUL.md"]
[[hooks.session_start.instructions.rules]]
when = ["startup", "clear"]
include = ["instructions/OPERATOR.md"]
[[hooks.session_start.instructions.rules]]
when = ["compact"]
include = ["instructions/POST_COMPACT.md"]
# Operational principles live in ~/.agents/AGENTS.md (loaded natively by the
# harness every session), not in an injected prompt file.

# ---
[hooks.pre_tool_use]

[hooks.pre_tool_use.policy]
[hooks.pre_tool_use.policy.allow]
tools = ["LS", "Read", "WebFetch", "codebase:*_search","context:ask_docs_agent","context:fetch_docs","vscode:get_*","vscode:list_*"]
message = "[policy] {tool_name} is allowlisted"
[hooks.pre_tool_use.policy.ask]
tools = ["review:*"]
message = "[policy] confirm {tool_name} tool use"
[hooks.pre_tool_use.policy.deny]
tools = ["Grep","codebase:edit_file"]
message = "[policy] {tool_name} is denylisted"
[hooks.pre_tool_use.policy.overrides."Grep"]
decision = "deny"
message = "[policy] Grep blocked; use codebase_search for high-quality codebase searching, or read files directly for targeted info. Only use ripgrep through bash if searching **within** a file or collection of **logfiles**."
[hooks.pre_tool_use.policy.overrides."Execute"]
decision = "deny"
message = "[policy] Just use `rg` — it's faster and already available."
match_input.command = "(?<![\\w-])grep\\b"

[hooks.pre_tool_use.commit_review_guard]
type = "committed"
max_chars = 6000

[hooks.pre_tool_use.rtk]
# Token-reduction proxy (https://github.com/rtk-ai/rtk). The hook calls
# `rtk rewrite` and, on success, mutates the Execute command in-flight.
# Transparent: if rtk is missing, slow, or has no rewrite for a command,
# the hook exits cleanly and the original command runs unmodified.
enabled = true

# Per-surface toggles. Any absent key defaults to enabled (true). Flip a
# single surface to `false` if its rewrite misbehaves in a real workflow —
# no need to disable the whole hook. Common surfaces: git, grep, read, ls,
# find, diff, gh, cargo, go, pytest, jest, vitest, playwright, rspec, rake,
# tsc, next, prettier, eslint, biome, knip, lint, ruff, rubocop,
# golangci-lint, docker, make, err, test, smart.
[hooks.pre_tool_use.rtk.surfaces]
grep = false # Preserve ripgrep-only flags such as --hidden and --glob.
# git = false   # e.g. keep raw git output if commit_review_guard needs it


[hooks.pre_tool_use.checks]
# Require validators to run once through scripts/run-check: foreground,
# complete stdout/stderr visible live, the same bytes persisted, and the
# validator's exact exit status returned. Raw, backgrounded, redirected,
# piped, or post-command-polled recognized validators are denied, including
# in `droid exec`; a violation intentionally fails that automation run.
enabled = true
# The validator vocabulary lives here, not in code: a bare `tools` entry at
# segment start (after env/wrapper prefixes) is a check. Structural runners
# (npm/pnpm/yarn/bun run <test|lint|...>, turbo, go test, cargo test/clippy,
# make ...test/check/lint) are matched in the hook itself.
tools = [
  "vitest", "jest", "pytest", "playwright",
  "eslint", "biome", "oxlint", "prettier", "oxfmt", "knip",
  "tsc", "pyright", "mypy",
  "ruff", "vulture", "golangci-lint",
  "slop-scan", "react-doctor",
]

[hooks.pre_tool_use.tirith]
# Tirith terminal-security guard — https://github.com/sheeki03/tirith
enabled   = true
fail_mode = "open"     # "closed" → deny when tirith unavailable
timeout   = 5
tools     = ["Execute", "Bash"]
# pipe_to_interpreter false-positive filter — LHS commands that don't fetch/eval remote content. [] to disable.
pipe_to_interpreter_safe_lhs = [
    "git", "gh", "linear", "jq", "yq",
    "cat", "echo", "printf",
    "head", "tail", "awk", "sed", "tr", "cut",
    "ls", "find", "rg", "grep", "sort", "uniq",
]

[hooks.pre_tool_use.vscode_auto_ensure]
# Transparently spawn/reuse the isolated headless VSCode instance behind
# vscode:* MCP tool calls (see the vscode-workspace skill). The first call on
# a cold workspace blocks ~10-30s while the editor boots; later calls cost a
# single socket health check. Workspaces are tagged with DROID_SESSION_ID and
# retired by the session_end hook. workspace_path is canonicalized via
# updatedInput (the bridge socket hashes the resolved path).
enabled = true
timeout = 90
# On a cold spawn, pre-open the files the tool call is about to query so the
# first diagnostics/symbol result comes back populated, not empty.
warm = true
warm_wait = 4

# ---
[hooks.post_tool_use]

[hooks.post_tool_use.instructions]
debug = false
prompts_dir = "~/.agents/prompts"

[[hooks.post_tool_use.instructions.rules]]
match.tool = "ExitSpecMode"
match.output = { approved = false }
include = ["instructions/IMPROVE_SPEC.md"]

[[hooks.post_tool_use.instructions.rules]]
match.tool = "ExitSpecMode"
match.output = { approved = true, isEdited = false }
include = ["instructions/IMPLEMENT_SPEC.md"]

[[hooks.post_tool_use.instructions.rules]]
match.tool = "ExitSpecMode"
match.output = { approved = true, isEdited = true }
include = ["instructions/IMPLEMENT_SPEC.md", "instructions/READ_EDITED_SPEC.md"]

[[hooks.post_tool_use.instructions.rules]]
match.tool = "ExitSpecMode"
match.output = { approved = true }
include = ["instructions/INIT_NOTES.md"]

[[hooks.post_tool_use.instructions.rules]]
match.tool = "ProposeMission"
match.output = { approved = true }
include = ["instructions/INIT_NOTES.md"]

# ---
[hooks.notification]

# ---
[hooks.pre_compact]

# ---
[hooks.user_prompt_submit]

[hooks.user_prompt_submit.conflict_guard]
cache_dir = "/tmp/conflicts"
token_threshold = 20000
skip_prefix = "" # ignored if missing/null or empty string

# ---
[hooks.subagent_stop]

# ---
[hooks.stop]

# ---
[hooks.session_end]

[hooks.session_end.store_artifacts]
tail = 1
tail_when = ["prompt_input_exit", "other"]
todo_when = ["prompt_input_exit", "clear", "other"]

[hooks.session_end.vscode_workspaces]
# Retire headless VSCode workspaces spawned via the vscode-workspace skill.
# mode = "session": release the ending session's claim and retire workspaces
# it solely owned (plus always reap dead processes/stale sockets);
# mode = "all" retires every known workspace. Fails open.
enabled = true
mode = "session"
timeout = 25

# ------------------------------------------------------------------------------
[tools]

[tools.vscode-workspace]
# Default extensions installed into the shared extensions dir by
# `vscode_ws.py setup` (the bridge itself is always installed). TS/JS/HTML/CSS
# language features ship with VSCode; these add Python, ESLint, Rust, Go.
extensions = [
    "ms-python.python",
    "ms-python.vscode-pylance",
    "dbaeumer.vscode-eslint",
    "rust-lang.rust-analyzer",
    "golang.go",
]

# ------------------------------------------------------------------------------
